services:
  app:
    image: mcr.microsoft.com/playwright:v1.61.0-noble
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /workspace/guitar-app
    command: bash -lc "npm ci && npm run start:e2e"
    ports:
      - "4200:4200"
    networks:
      default:
        aliases:
          - guitar-web
    volumes:
      - .:/workspace
      - app_node_modules:/workspace/guitar-app/node_modules
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4200').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  e2e:
    image: mcr.microsoft.com/playwright:v1.61.0-noble
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /workspace/guitar-app
    command: bash -lc "npm ci && npm run e2e"
    depends_on:
      app:
        condition: service_healthy
    environment:
      PLAYWRIGHT_BASE_URL: http://guitar-web:4200
    volumes:
      - .:/workspace
      - e2e_node_modules:/workspace/guitar-app/node_modules

volumes:
  app_node_modules:
  e2e_node_modules:
