<section class="tuning-editor" aria-labelledby="tuning-editor-title">
  <h5 id="tuning-editor-title" class="mb-3">Tempo & Tuning</h5>
  <div class="row g-3 mb-3">
    <div class="col-12 col-md-6">
      <div class="card h-100">
        <div class="card-body">
          <label class="form-label fw-semibold" for="sheetTempo">Tempo (BPM)</label>
          <app-bpm-selector controlId="sheetTempo" [ngModel]="tempo()" (ngModelChange)="tempo.set($event)" />
        </div>
      </div>
    </div>

    <div class="col-12 col-md-6">
      <div class="card h-100">
        <div class="card-body">
          <label class="form-label fw-semibold" for="sheetCapodaster">Capodaster (Fret)</label>
          <input id="sheetCapodaster" type="number" class="form-control" [ngModel]="capodaster()" (ngModelChange)="capodaster.set($event)" min="0" max="12" />
        </div>
      </div>
    </div>

    <div class="col-12">
      <div class="card">
        <div class="card-body">
          <h6 class="card-title mb-3">Guitar Tuning (Low to High)</h6>
          <div class="row g-2">
            @for (tuningNote of tuning(); track i; let i = $index) {
              <div class="col-6 col-md-2">
                <label class="form-label small">String {{ 6 - i }}</label>
                <div class="input-group input-group-sm">
                  <select class="form-select" [attr.aria-label]="'String ' + (6 - i) + ' note'" [(ngModel)]="tuningNote.semitone">
                    @for (semitone of semitones(); track semitone) {
                      <option [value]="semitone">{{ semitone }}</option>
                    }
                  </select>
                  <select class="form-select" [attr.aria-label]="'String ' + (6 - i) + ' octave'" [ngModel]="tuningNote.octave" (ngModelChange)="tuningNote.octave = +$event">
                    @for (octave of octaves(); track octave) {
                      <option [value]="octave">{{ octave }}</option>
                    }
                  </select>
                </div>
              </div>
            }
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="tuning-editor-actions">
    <button class="btn btn-success" type="button" (click)="save.emit()">Save Settings</button>
  </div>
</section>
