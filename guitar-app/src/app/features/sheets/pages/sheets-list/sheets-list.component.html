<div class="container app-page">
  <div class="page-header mb-4">
    <h2 class="mb-0"><i class="bi bi-music-note-list me-2" aria-hidden="true"></i>Song Sheets</h2>
    <div class="dropdown">
      <button #menuButton class="btn btn-outline-secondary btn-sm page-menu-toggle" type="button"
        data-bs-toggle="dropdown" aria-expanded="false" aria-label="Song sheets actions">
        <i class="bi bi-three-dots" aria-hidden="true"></i>
      </button>
      <ul class="dropdown-menu dropdown-menu-end">
        <li>
          <button class="dropdown-item" type="button" [disabled]="importer.writing" (click)="importer.openPicker(menuButton)">
            <i class="bi bi-upload me-2" aria-hidden="true"></i>Import song sheet
          </button>
        </li>
      </ul>
    </div>
  </div>
  <div class="mb-3 d-flex align-items-center">
    <input id="newSheetName" [(ngModel)]="newSheetName" class="form-control me-2" placeholder="New Song Sheet Name" (keyup.enter)="createSheet()" />
    <button class="btn btn-primary" (click)="createSheet()" [disabled]="!newSheetName.trim()" aria-label="Add">
      <i class="bi bi-plus-lg"></i>
    </button>
  </div>
  <app-json-import #importer kind="guitar-song-sheet" [showPicker]="false" (imported)="load()" />
  @if (sheets.length === 0) {
  <div class="alert alert-info">No Song Sheets yet. Create your first one!</div>
  }
  <ul class="list-group">
    @for (sheet of sheets; track sheet.id) {
    <li class="list-group-item d-flex justify-content-between align-items-center">
      <a class="text-break me-2" [routerLink]="['/sheets', sheet.id]">{{ sheet.name }}</a>
      <div class="d-flex flex-wrap justify-content-end gap-2">
      <app-export-button [id]="sheet.id" type="guitar-song-sheet" />
      <button aria-label="Delete song sheet" class="btn btn-sm btn-outline-danger" (click)="deleteSheet(sheet.id)"><i class="bi bi-trash"></i></button>
      </div>
    </li>
    }
  </ul>
</div>
<router-outlet></router-outlet>
