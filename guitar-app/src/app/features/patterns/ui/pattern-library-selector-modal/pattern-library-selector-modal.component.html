<div class="modal-content-wrapper">
  <div class="modal-header">
    <h5 class="modal-title">{{ selectionMode === 'single' ? 'Select Pattern' : 'Select Patterns' }}</h5>
    <button type="button" class="btn-close" (click)="onCancel()"></button>
  </div>
  <div class="modal-body">
    <app-patterns-library-selector [selectionMode]="selectionMode" (selectedPatternsChange)="onSelectionChange($event)">
    </app-patterns-library-selector>
  </div>
  <div class="modal-footer">
    <button class="btn btn-secondary" type="button" (click)="onCancel()">
      <i aria-hidden="true" class="bi bi-x"></i> Cancel
    </button>
    <button class="btn btn-primary" type="button" (click)="onSave()" [disabled]="!canApply">
      <i aria-hidden="true" class="bi bi-check"></i> {{ selectionMode === 'single' ? 'Apply Pattern' : 'Apply Patterns' }}
    </button>
  </div>
</div>
