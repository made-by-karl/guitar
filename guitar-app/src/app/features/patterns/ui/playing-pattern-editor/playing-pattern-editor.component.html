<div class="playing-pattern-editor">
  @if (pattern(); as patternValue) {
    <div class="card">
      <div class="card-body">
        <div class="d-flex justify-content-end mb-3">
          <button
            class="btn btn-sm"
            [class.btn-danger]="isPatternPlaybackActive()"
            [class.btn-outline-primary]="!isPatternPlaybackActive()"
            type="button"
            (click)="playPattern()">
            <i class="bi" [class.bi-stop-fill]="isPatternPlaybackActive()" [class.bi-play-fill]="!isPatternPlaybackActive()"></i>
            {{ isPatternPlaybackActive() ? 'Stop' : 'Play' }}
          </button>
        </div>

        <div class="mb-2">
          <label class="form-label" for="playingPatternName">Name</label>
          <input id="playingPatternName" class="form-control" [(ngModel)]="patternValue.name" name="name" type="text" autocomplete="off" required />
        </div>
        <div class="mb-2">
          <label class="form-label" for="playingPatternDescription">Description</label>
          <input id="playingPatternDescription" class="form-control" [(ngModel)]="patternValue.description" name="description" type="text" autocomplete="off" />
        </div>
        <div class="mb-2 row g-2">
          <div class="col-12 col-md-4">
            <label class="form-label" for="playingPatternCategory">Category</label>
            <input id="playingPatternCategory" class="form-control" [(ngModel)]="patternValue.category" name="category" type="text" autocomplete="off" />
          </div>
          <div class="col-12 col-md-4">
            <label class="form-label" for="playingPatternSuggestedGenre">Suggested Genre</label>
            <input id="playingPatternSuggestedGenre" class="form-control" [(ngModel)]="patternValue.suggestedGenre" name="suggestedGenre" type="text" autocomplete="off" />
          </div>
          <div class="col-12 col-md-4">
            <label class="form-label" for="playingPatternExampleSong">Example Song</label>
            <input id="playingPatternExampleSong" class="form-control" [(ngModel)]="patternValue.exampleSong" name="exampleSong" type="text" autocomplete="off" />
          </div>
        </div>

        <div class="mb-2">
          @for (measureData of measuresForDisplay(); track measureData.measureIndex) {
            <div class="card card-body p-3 bg-light mb-3">
              <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="mb-0">Measure {{ measureData.measureIndex + 1 }}</h5>
                <div class="btn-group" role="group">
                  <button
                    class="btn btn-outline-secondary btn-sm"
                    type="button"
                    (click)="copyMeasure(measureData.measureIndex)"
                    title="Copy measure">
                    <i class="bi bi-copy"></i>
                  </button>
                  <button
                    class="btn btn-outline-danger btn-sm"
                    type="button"
                    (click)="removeMeasure(measureData.measureIndex)"
                    title="Remove measure">
                    <i class="bi bi-x"></i>
                  </button>
                </div>
              </div>

              <app-playing-measure-editor
                [measure]="measureData.measure"
                (measureChange)="updateMeasure(measureData.measureIndex, $event)"
                [actionGrips]="getMeasureActionGrips(measureData.measureIndex)"
                (actionGripsChange)="updateMeasureActionGrips(measureData.measureIndex, $event)"
                [measureLabel]="'Measure ' + (measureData.measureIndex + 1)"
                (assignActionGrip)="assignActionGrip(measureData.measureIndex, $event)" />
            </div>
          }
        </div>

        <div class="d-flex justify-content-between align-items-center mt-3">
          <button class="btn btn-outline-primary btn-sm" type="button" (click)="addMeasure()">
            <i class="bi bi-plus"></i> Add Measure
          </button>
        </div>
      </div>
    </div>
  }
</div>
