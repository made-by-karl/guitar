@if (selected; as current) {
  <section class="editor-preview" [class.is-collapsed]="collapsed()" aria-label="Live measure preview"
    [attr.aria-description]="current.label + ', ' + current.measure.timeSignature"
    [attr.data-measure-index]="selectedIndex() ?? 0">
    @if (collapsed()) {
      <span class="preview-collapsed-label small text-muted">Measure preview</span>
    } @else {
      <div class="preview-drawing">
        @if (playbackPosition(); as position) { <span class="small playback-position">{{ position.status === 'buffering' ? 'Buffering…' : position.status === 'playing' ? 'Playing' : 'Paused' }} · Action {{ position.actionIndex + 1 }}</span> }
        <app-playing-actions [measures]="[current.measure]" [notationContexts]="[current.context]"
          [notationHistory]="current.history" [showActionIndex]="true" [compact]="true"
          [visibleActionIndices]="visibleActions()"
          [appPlaybackHighlight]="(selectedIndex() ?? 0) === playbackPosition()?.measureIndex ? playbackPosition() : undefined" />
      </div>
    }
    <div class="preview-controls">
    <ng-content select="[preview-actions]" />
    <button type="button" class="btn btn-outline-secondary btn-sm app-icon-button preview-toggle"
      [attr.aria-label]="collapsed() ? 'Expand preview' : 'Collapse preview'"
      [title]="collapsed() ? 'Expand preview' : 'Collapse preview'"
      [attr.aria-expanded]="!collapsed()" (click)="toggle()">
      <i class="bi" [class.bi-chevron-down]="collapsed()" [class.bi-chevron-up]="!collapsed()" aria-hidden="true"></i>
    </button>
    </div>
  </section>
}
